name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: dockpal-linux-amd64
          - goos: linux
            goarch: arm64
            binary: dockpal-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must match go.mod's toolchain (1.26), same as CI.
          go-version: '1.26'

      # The binary embeds the Svelte SPA via go:embed; without this step the
      # built binary refuses to serve / ("frontend not built").
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: svelte/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./svelte
        run: npm ci

      - name: Build and embed frontend
        run: make svelte-embed

      - name: Build binary
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "Building ${{ matrix.binary }} version: ${VERSION}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o ${{ matrix.binary }} .

      # Running the freshly built binary only works when its architecture
      # matches the runner (ubuntu-latest is x86_64). Verifying the arm64
      # binary this way fails with "Exec format error", so we only execute the
      # amd64 build and just confirm the arm64 artifact was produced.
      - name: Verify binary reports the right version
        if: matrix.goarch == 'amd64'
        run: ./${{ matrix.binary }} version

      - name: Verify arm64 artifact exists (cannot execute on x86_64 runner)
        if: matrix.goarch != 'amd64'
        run: |
          test -s "${{ matrix.binary }}" || { echo "missing ${{ matrix.binary }}"; exit 1; }
          file "${{ matrix.binary }}" | grep -q 'ELF 64-bit' || { echo "not an ELF binary"; exit 1; }

      - name: Generate SHA256 checksum
        run: sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256

      - name: Attach binary to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.binary }}
            ${{ matrix.binary }}.sha256
          # Keep the release notes written on the tag; do not auto-regenerate.
          generate_release_notes: false