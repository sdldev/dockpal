name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # The binary embeds the Svelte SPA via go:embed; without this step the
      # built binary refuses to serve / ("frontend not built").
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: svelte/package-lock.json

      - name: Build and embed frontend
        run: make svelte-embed

      - name: Build binary
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "Building version: ${VERSION}"
          make build-linux-amd64 VERSION="${VERSION}"

      - name: Verify binary reports the right version
        run: ./dockpal-linux-amd64 version

      - name: Attach binary to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dockpal-linux-amd64
          # Keep the release notes written on the tag; do not auto-regenerate.
          generate_release_notes: false