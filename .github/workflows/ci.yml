name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Pinned to go.mod's toolchain (1.26). Pinning CI below go.mod's version
  # mixes the downloaded toolchain with setup-go's and breaks cover builds.
  GO_VERSION: '1.26'
  # Node 24 (current LTS, "Krypton"). engines allows ^22 || >=24;
  # vitest 4 dropped Node 20.
  NODE_VERSION: '24'

jobs:
  # Single verify job: frontend type-check/tests first (fast fail), then
  # embed the SPA and build the real binary exactly like a release does.
  # This replaces the previous backend/frontend/prod-build trio, which
  # compiled the same Go code three times and let the backend job run
  # `go build` without the embedded frontend (failing on the go:embed
  # pattern in web/embed.go).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: svelte/package-lock.json

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          go mod download
          cd svelte && npm ci

      - name: Frontend type check
        working-directory: ./svelte
        run: npm run check

      - name: Frontend unit tests
        working-directory: ./svelte
        run: npm run test:unit

      - name: Build frontend and embed
        run: make svelte-embed

      - name: Build binary (with embedded SPA)
        run: VERSION=${{ github.sha }} make build

      - name: Lint
        run: make lint

      - name: Test (with race detection)
        run: make test

      - name: Vet integration suite
        run: go vet -tags=integration ./internal/integration/...

      - name: Test integration
        run: make test-integration
        timeout-minutes: 10

      - name: Cover
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -1 | awk '{printf "Total coverage: **%s**\n", $3}' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 14

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockpal-ci-binary
          path: dockpal
          retention-days: 7
